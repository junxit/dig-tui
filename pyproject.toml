[build-system]
# Pinned exactly, like the dependencies below.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "dig-tui"
version = "0.3.0"
description = "A terminal user interface for the Unix dig DNS lookup utility"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jade Naaman" }]
keywords = ["dns", "dig", "tui", "textual", "terminal"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
]

# Exact pins: nothing changes version unless a pin here is edited on purpose.
# rich is declared even though textual pulls it in, because app.py imports it directly and the
# S2 protections depend on its markup handling.
dependencies = ["textual==8.2.8", "rich==15.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1"]

[project.scripts]
dig-tui = "dig_tui.app:main"

[project.urls]
Homepage = "https://github.com/junxit/dig-tui"

[tool.hatch.build.targets.wheel]
packages = ["src/dig_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4"]
# S603/S607 flag subprocess use; this app's entire purpose is invoking `dig`, and the
# argv is built by build_dig_command() with no shell and validated inputs.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
